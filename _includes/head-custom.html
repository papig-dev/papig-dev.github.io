<!-- Bilingual (ko/en): pick initial language before first paint, wire up toggle clicks -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('papig-lang');
      var lang = (stored === 'ko' || stored === 'en')
        ? stored
        : ((navigator.language || 'en').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en');
      document.documentElement.setAttribute('data-lang', lang);
    } catch (e) {
      document.documentElement.setAttribute('data-lang', 'ko');
    }
  })();
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-set-lang]');
    if (!btn) return;
    var lang = btn.getAttribute('data-set-lang');
    document.documentElement.setAttribute('data-lang', lang);
    try { localStorage.setItem('papig-lang', lang); } catch (e) {}
  });
</script>
